<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Qué tipo de líder llevas dentro? · Anastasia Iamachkine</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
  emailjs.init("Fj3IkXRi9NvF9LxGY");
</script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --accent: #FFD600;
    --accent2: #FFF176;
    --text: #f0f0f0;
    --muted: #6b6b6b;
    --body-text: #c0c0d0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  /* Pantallas */
  .screen { display: none; animation: fadeUp 0.5s ease forwards; }
  .screen.active { display: block; }
  #screen-intro.active { display: flex; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Intro */
  #screen-intro {
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 60px 24px;
  }

  .intro-author-box {
    margin-bottom: 24px;
  }

  .intro-author-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 2px;
    color: var(--text);
  }

  .intro-author-role {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }

  .intro-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 12vw, 96px);
    line-height: 0.9;
    letter-spacing: -1px;
    margin-bottom: 24px;
  }

  .intro-title .highlight { color: var(--accent); }

  .intro-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    display: inline-block;
    padding: 6px 14px;
    margin-bottom: 32px;
  }

  .intro-bio {
    font-size: 15px;
    line-height: 1.8;
    color: var(--body-text);
    margin-bottom: 36px;
    max-width: 560px;
  }

  .intro-bio p { margin-bottom: 12px; }
  .intro-bio p:last-child { margin-bottom: 0; color: var(--text); font-weight: 600; }

  .intro-sub {
    font-size: 17px;
    color: var(--muted);
    max-width: 480px;
    margin-bottom: 48px;
    line-height: 1.6;
  }

  .pill-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  .pill {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 8px 16px;
    border: 1px solid var(--surface2);
    color: var(--muted);
    border-radius: 100px;
  }

  .btn-start {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 18px 48px;
    margin-bottom: 40px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    cursor: pointer;
    clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
    transition: all 0.2s;
  }

  .btn-start:hover { background: var(--accent2); transform: translateY(-2px); }

  /* Quiz */
  .progress-wrap { padding: 48px 0 32px; }
  .progress-meta { display: flex; justify-content: space-between; margin-bottom: 10px; }

  .progress-label,
  .progress-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
  }

  .progress-label { color: var(--muted); text-transform: uppercase; }
  .progress-count { color: var(--accent); }
  .progress-bar-bg { height: 2px; background: var(--surface2); }

  .progress-bar-fill {
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.5s ease;
  }

  .question-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .question-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 8vw, 64px);
    line-height: 0.95;
    margin-bottom: 12px;
  }

  .question-sub {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 40px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 32px;
  }

  .option-card {
    background: var(--surface);
    border: 1px solid var(--surface2);
    padding: 24px 20px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .option-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--accent);
    transform: scaleY(0);
    transition: transform 0.2s;
  }

  .option-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .option-card:hover::before,
  .option-card.selected::before { transform: scaleY(1); }
  .option-card.selected { border-color: var(--accent); background: rgba(255, 214, 0, 0.08); }

  .option-emoji { font-size: 28px; margin-bottom: 12px; display: block; }
  .option-text { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }
  .option-sub { font-family: 'DM Mono', monospace; font-size: 12px; line-height: 1.4; color: var(--muted); }

  .nav-row { display: flex; justify-content: space-between; align-items: center; padding-bottom: 48px; }

  .btn-back {
    background: transparent;
    border: 1px solid var(--surface2);
    color: var(--muted);
    padding: 12px 24px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-back:hover { border-color: var(--muted); color: var(--text); }

  .btn-next {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 14px 32px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0.3;
    pointer-events: none;
  }

  .btn-next.active { opacity: 1; pointer-events: all; }
  .btn-next.active:hover { background: var(--accent2); transform: translateY(-1px); }

  /* Formulario */
  .form-screen { padding: 48px 0; }

  .form-tag {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .form-title { font-family: 'Bebas Neue', sans-serif; font-size: 48px; margin-bottom: 8px; }
  .form-sub { font-size: 15px; color: var(--muted); margin-bottom: 40px; }
  .form-group { margin-bottom: 24px; }

  .form-label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .form-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--surface2);
    color: var(--text);
    padding: 16px 20px;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--muted); }

  .btn-submit {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 18px 48px;
    margin-top: 8px;
    width: 100%;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-submit:hover { background: var(--accent2); transform: translateY(-2px); }

  .privacy-note {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-top: 16px;
  }

  /* Resultado */
  .result-screen { padding-top: 48px; }

  .result-badge {
    display: inline-block;
    background: var(--accent);
    color: var(--bg);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 6px 14px;
    margin-bottom: 24px;
  }

  .result-emoji {
    display: block;
    font-size: 72px;
    margin-bottom: 16px;
    animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  .result-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 10vw, 80px);
    line-height: 0.9;
    margin-bottom: 16px;
  }

  .result-subtitle { font-size: 18px; font-weight: 600; color: var(--muted); margin-bottom: 24px; }
  .result-desc { font-size: 16px; line-height: 1.7; color: var(--body-text); margin-bottom: 32px; }

  .score-bars { margin-bottom: 40px; }
  .score-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }

  .score-bar-label {
    width: 90px;
    flex-shrink: 0;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--muted);
  }

  .score-bar-track { flex: 1; height: 4px; background: var(--surface2); }
  .score-bar-fill { height: 4px; border-radius: 2px; animation: barGrow 0.8s ease var(--delay, 0s) both; }
  @keyframes barGrow { from { width: 0 !important; } }

  .result-insight {
    background: var(--surface);
    border-left: 3px solid var(--accent);
    padding: 24px;
    margin-bottom: 40px;
  }

  .result-insight-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .result-insight-text { font-size: 15px; line-height: 1.7; color: var(--body-text); }

  .result-cta { border: 1px solid var(--accent); padding: 32px; margin-bottom: 24px; text-align: center; }
  .result-cta-title { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--accent); margin-bottom: 16px; }
  .result-cta-text { font-size: 16px; line-height: 1.7; color: var(--body-text); margin-bottom: 24px; }

  .btn-whatsapp {
    display: block;
    width: 100%;
    background: #25D366;
    color: #fff;
    border: none;
    padding: 16px 32px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-whatsapp:hover { background: #1da851; transform: translateY(-1px); }

  .btn-instagram {
    display: inline-block;
    margin-top: 12px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--surface2);
    padding: 10px 24px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }
